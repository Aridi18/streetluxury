# Production-like stack: PostgreSQL, Redis (rate limiting), API (+ web app) and an analysis worker.
# 1. cp .env.example .env and fill in the secrets (at minimum AS_STORAGE_ENCRYPTION_KEY, POSTGRES_PASSWORD)
# 2. docker compose up -d --build
# 3. docker compose run --rm worker python -m app.cli download-models   (once; see THIRD_PARTY_NOTICES.md)
# Put a TLS-terminating reverse proxy in front of port 8000 (see docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: audio_sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d audio_sentinel"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      AS_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/audio_sentinel
      AS_REDIS_URL: redis://redis:6379/0
    volumes: [objects:/data/objects]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      AS_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/audio_sentinel
      AS_REDIS_URL: redis://redis:6379/0
    volumes: [objects:/data/objects, models:/models]
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 6g }

volumes:
  pgdata:
  objects:
  models:
