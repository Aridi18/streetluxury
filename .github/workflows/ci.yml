name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: audio_sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - name: Migrations apply cleanly
        env:
          AS_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/audio_sentinel_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests (SQLite)
        run: pytest -m "not ml"
      - name: Tests (PostgreSQL)
        env:
          AS_TEST_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/audio_sentinel_test
        run: pytest -m "not ml" tests/test_api.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
