[project]
name = "audio-sentinel"
version = "1.0.0"
description = "Audio Sentinel: AI-assisted audio forensics and tampering detection (API, worker, analysis engine)"
requires-python = ">=3.11"
license = { text = "Proprietary (see repository LICENSE); third-party notices in THIRD_PARTY_NOTICES.md" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "scipy>=1.12",
  "librosa>=0.10",
  "soundfile>=0.12",
  "soxr>=0.3",
  "pillow>=10",
  "reportlab>=4.0",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "redis>=5",
  "boto3>=1.34",
]

[project.optional-dependencies]
# Machine-learning detectors (install on analysis workers).
ml = [
  "torch>=2.3",
  "transformers>=4.44",
  "safetensors>=0.4",
  "huggingface_hub>=0.24",
]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3]>=5", "ruff>=0.6", "pyarrow>=15"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning"]
markers = [
  "ml: requires torch and downloaded model weights",
  "postgres: requires a PostgreSQL database (AS_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["app/analysis/synthetic/aasist_model.py", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "B008", "E501", "S311"]
